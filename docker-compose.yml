services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: changeme
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  sentinel:
    image: paschendale/sentinel:latest
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      DATABASE_URL: postgres://sentinel:changeme@db:5432/sentinel
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: changeme
      JWT_SECRET: change-this-to-a-random-secret
    # RBMC branch: the station list comes from the IBGE RBMCPoint shapefile. The image
    # ships a copy; to replace it, drop RBMCPoint.{shp,shx,dbf,prj,cst} into ./rbmc and
    # uncomment the mount — the API re-syncs stations when the files' mtime changes.
    # volumes:
    #   - ./rbmc:/app/apps/api/data/rbmc:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
