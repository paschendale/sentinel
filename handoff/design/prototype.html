<title>Sentinel Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#18181b;--surface:#1f1f23;--surface-raised:#27272a;--overlay:rgba(255,255,255,0.05);--scrim:rgba(0,0,0,0.6);--border:#333333;--border-strong:#71717a;--fg:#f4f4f5;--fg-muted:#a1a1aa;--fg-subtle:#8e8e98;--primary:#f4f4f5;--on-primary:#18181b;--accent:#10b981;--operational:#34d399;--operational-solid:#10b981;--operational-tint:#022c22;--degraded:#fbbf24;--degraded-solid:#f59e0b;--degraded-tint:#451a03;--outage:#f87171;--outage-solid:#ef4444;--outage-tint:#450a0a;--unknown-solid:#71717a;--strip-empty:#333333;--shadow-popover:0 20px 25px -5px rgba(0,0,0,0.5);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;--radius-xs:1px;--radius-sm:2px;--radius-md:8px;--radius-full:9999px;--page-max:1180px;--form-max:672px;--prose-max:68ch;--font-mono:Inconsolata, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;--font-sans:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#ffffff;--surface:#fafafa;--surface-raised:#f4f4f5;--overlay:rgba(24,24,27,0.05);--scrim:rgba(24,24,27,0.45);--border:#e4e4e7;--border-strong:#71717a;--fg:#18181b;--fg-muted:#52525b;--fg-subtle:#6b6b76;--primary:#18181b;--on-primary:#ffffff;--accent:#059669;--operational:#047857;--operational-solid:#059669;--operational-tint:#d1fae5;--degraded:#92400e;--degraded-solid:#d97706;--degraded-tint:#fef3c7;--outage:#b91c1c;--outage-solid:#dc2626;--outage-tint:#fee2e2;--unknown-solid:#8e8e98;--strip-empty:#e4e4e7;--shadow-popover:0 10px 24px -6px rgba(24,24,27,0.18);color-scheme:light}}
:root[data-theme="light"]{--bg:#ffffff;--surface:#fafafa;--surface-raised:#f4f4f5;--overlay:rgba(24,24,27,0.05);--scrim:rgba(24,24,27,0.45);--border:#e4e4e7;--border-strong:#71717a;--fg:#18181b;--fg-muted:#52525b;--fg-subtle:#6b6b76;--primary:#18181b;--on-primary:#ffffff;--accent:#059669;--operational:#047857;--operational-solid:#059669;--operational-tint:#d1fae5;--degraded:#92400e;--degraded-solid:#d97706;--degraded-tint:#fef3c7;--outage:#b91c1c;--outage-solid:#dc2626;--outage-tint:#fee2e2;--unknown-solid:#8e8e98;--strip-empty:#e4e4e7;--shadow-popover:0 10px 24px -6px rgba(24,24,27,0.18);color-scheme:light}
/* Sentinel components. Every colour, size and radius is a token from tokens.css. */
.sn-preview{margin:0;padding:24px;background:var(--bg);color:var(--fg);font:400 14px/20px var(--font-mono)}
.sn-preview *,.sn *{box-sizing:border-box}
.sn{color:var(--fg);font:400 14px/20px var(--font-mono)}
:where(.sn) a{color:inherit}
.sn-stack{display:flex;flex-direction:column;gap:var(--space-4)}
.sn-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3)}
.sn-muted{color:var(--fg-muted)}
.sn-subtle{color:var(--fg-subtle)}
.sn-label{font:500 11px/16px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle)}
.sn-num{font-variant-numeric:tabular-nums}
.sn-prose{font:400 15px/24px var(--font-sans);max-width:var(--prose-max);color:var(--fg)}
.sn-prose h3{font:600 18px/28px var(--font-sans);margin:var(--space-6) 0 var(--space-2)}
.sn-prose p{margin:0 0 var(--space-3)}
.sn :focus-visible,.sn-preview :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Button */
.sn-btn{display:inline-flex;align-items:center;gap:var(--space-2);font:400 14px/20px var(--font-mono);padding:7px 16px;border:1px solid transparent;border-radius:var(--radius-sm);background:none;color:var(--fg);cursor:pointer;text-decoration:none;white-space:nowrap}
.sn-btn:disabled,.sn-btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.sn-btn--primary{background:var(--primary);color:var(--on-primary)}
.sn-btn--secondary{border-color:var(--border-strong)}
.sn-btn--secondary:hover,.sn-btn--ghost:hover{background:var(--overlay)}
.sn-btn--ghost{color:var(--fg-muted)}
.sn-btn--ghost:hover{color:var(--fg)}
.sn-btn--danger{color:var(--outage);border-color:var(--outage)}
.sn-btn--danger:hover{background:var(--outage-tint)}
.sn-btn--sm{font-size:12px;line-height:16px;padding:3px 10px}

/* Segmented control */
.sn-seg{display:inline-flex;gap:var(--space-1)}
.sn-seg button{font:400 12px/16px var(--font-mono);padding:4px 12px;border:0;border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--fg-muted);cursor:pointer}
.sn-seg button:hover{color:var(--fg)}
.sn-seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}

/* Tag */
.sn-tag{display:inline-block;font:400 12px/16px var(--font-mono);padding:2px 6px;border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--fg);text-decoration:none;white-space:nowrap}
.sn-tag i{font-style:normal;color:var(--fg-subtle)}
a.sn-tag:hover{background:var(--overlay)}
.sn-tag[aria-current="true"]{background:var(--primary);color:var(--on-primary)}
.sn-tag[aria-current="true"] i{color:inherit;opacity:.7}
.sn-tags{display:flex;flex-wrap:wrap;gap:var(--space-1)}

/* Status indicator: a shape and a word, never colour alone */
.sn-status{display:inline-flex;align-items:center;gap:6px;font:400 13px/16px var(--font-mono);white-space:nowrap;color:var(--fg-subtle)}
.sn-mark{flex:none;width:9px;height:9px;background:var(--unknown-solid)}
.sn-status--operational{color:var(--operational)}
.sn-status--operational .sn-mark,.sn-mark--operational{background:var(--operational-solid);border-radius:var(--radius-full)}
.sn-status--degraded{color:var(--degraded)}
.sn-status--degraded .sn-mark,.sn-mark--degraded{background:var(--degraded-solid);width:11px;height:10px;clip-path:polygon(50% 0,100% 100%,0 100%)}
.sn-status--outage{color:var(--outage)}
.sn-status--outage .sn-mark,.sn-mark--outage{background:var(--outage-solid)}
.sn-status--recovered{color:var(--operational)}
.sn-status--recovered .sn-mark,.sn-mark--recovered{background:none;border:2px solid var(--operational-solid);border-radius:var(--radius-full)}
.sn-status--unknown .sn-mark,.sn-mark--unknown{background:none;border:2px solid var(--unknown-solid);border-radius:var(--radius-full)}
.sn-status--paused .sn-mark,.sn-mark--paused{height:3px;background:var(--unknown-solid)}
.sn-status--chip{padding:3px 8px;border-radius:var(--radius-sm);background:var(--surface-raised)}
.sn-status--chip.sn-status--operational,.sn-status--chip.sn-status--recovered{background:var(--operational-tint)}
.sn-status--chip.sn-status--degraded{background:var(--degraded-tint)}
.sn-status--chip.sn-status--outage{background:var(--outage-tint)}

/* Status banner */
.sn-banner{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3) var(--space-4);padding:var(--space-4) var(--space-6);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface)}
.sn-banner .sn-mark{width:14px;height:14px}
.sn-banner__title{font:600 18px/28px var(--font-mono);margin:0}
.sn-banner__meta{margin-left:auto;font:400 12px/16px var(--font-mono);color:var(--fg-muted)}
.sn-banner--operational{background:var(--operational-tint);border-color:var(--operational-solid)}
.sn-banner--operational .sn-banner__title{color:var(--operational)}
.sn-banner--degraded{background:var(--degraded-tint);border-color:var(--degraded-solid)}
.sn-banner--degraded .sn-banner__title{color:var(--degraded)}
.sn-banner--degraded .sn-mark{width:16px;height:14px}
.sn-banner--outage{background:var(--outage-tint);border-color:var(--outage-solid)}
.sn-banner--outage .sn-banner__title{color:var(--outage)}

/* History strip */
.sn-strip{display:flex;gap:2px;width:100%;height:28px}
.sn-strip--compact{height:14px;gap:1px}
.sn-strip__cell{flex:1 1 0;min-width:0;border-radius:var(--radius-xs);background:var(--strip-empty)}
.sn-strip__cell--operational{background:var(--operational-solid)}
.sn-strip__cell--degraded{background:var(--degraded-solid)}
.sn-strip__cell--outage{background:var(--outage-solid)}
.sn-strip__axis{display:flex;justify-content:space-between;margin-top:var(--space-1);font:400 12px/16px var(--font-mono);color:var(--fg-subtle)}

/* Section header and summary chips */
.sn-section__head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1) var(--space-3);padding-bottom:10px;border-bottom:1px solid var(--border)}
.sn-section__title{font:600 12px/16px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--fg)}
.sn-section__count{font:400 12px/16px var(--font-mono);color:var(--fg-muted);font-variant-numeric:tabular-nums}
.sn-section__desc{margin-left:auto;font:400 13px/20px var(--font-sans);color:var(--fg-subtle)}
.sn-section--outage .sn-section__title{color:var(--outage)}
.sn-section--degraded .sn-section__title{color:var(--degraded)}
.sn-section--recovered .sn-section__title{color:var(--operational)}
.sn-chips{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.sn-chip{display:inline-flex;align-items:center;gap:var(--space-2);padding:5px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font:400 12px/16px var(--font-mono);color:var(--fg-muted);text-decoration:none}
.sn-chip:hover{border-color:var(--border-strong)}
.sn-chip b{font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}

/* Table */
.sn-table-wrap{overflow-x:auto}
.sn-table{width:100%;border-collapse:collapse;font:400 14px/20px var(--font-mono)}
.sn-table th{text-align:left;padding:var(--space-2) var(--space-3);font:500 11px/16px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);white-space:nowrap}
.sn-table td{padding:var(--space-3);border-top:1px solid var(--border);color:var(--fg-muted);vertical-align:middle}
.sn-table tbody tr:hover{background:var(--overlay)}
.sn-table__name{color:var(--fg);text-decoration:none}
.sn-table__name:hover{text-decoration:underline}
.sn-table__sub{display:block;font-size:12px;line-height:16px;color:var(--fg-subtle)}
.sn-table td.sn-num,.sn-table th.sn-num{text-align:right}
.sn-check{width:16px;height:16px;margin:0;accent-color:var(--primary)}

/* Status card */
.sn-card{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);color:inherit;text-decoration:none;min-width:0}
a.sn-card:hover{border-color:var(--border-strong)}
.sn-card__name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.sn-card__state{display:flex;flex-wrap:wrap;align-items:center;gap:2px var(--space-2);font:400 12px/16px var(--font-mono);color:var(--fg-subtle);min-height:16px}
.sn-card__metric{font:600 24px/28px var(--font-mono);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sn-card__metric small{font:400 12px/16px var(--font-mono);color:var(--fg-subtle);margin-left:6px;letter-spacing:0}
.sn-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--space-3)}

/* Definition grid */
.sn-defs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:var(--space-4) var(--space-8);margin:0}
.sn-defs dt{font:500 11px/16px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);margin-bottom:var(--space-1)}
.sn-defs dd{margin:0;color:var(--fg)}

/* Code block and kbd */
.sn-code{margin:0;padding:var(--space-4);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);font:400 13px/20px var(--font-mono);color:var(--fg);overflow:auto;white-space:pre}
.sn-code .c{color:var(--fg-subtle)}
.sn-kbd{display:inline-block;min-width:18px;padding:0 5px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font:400 12px/16px var(--font-mono);color:var(--fg-muted);text-align:center}

/* App header (signed-in pages) */
.sn-appbar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3) var(--space-6);padding:var(--space-3) 0;border-bottom:1px solid var(--border)}
.sn-brand{display:inline-flex;align-items:center;gap:10px;font:600 20px/24px var(--font-mono);color:var(--fg);text-decoration:none}
.sn-brand img,.sn-brand svg{height:28px;width:auto;display:block}
.sn-nav{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-6);margin-right:auto}
.sn-nav a{padding:6px 0;color:var(--fg-muted);text-decoration:none;border-bottom:2px solid transparent}
.sn-nav a:hover{color:var(--fg)}
.sn-nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.sn-nav__count{margin-left:6px;padding:0 6px;border-radius:var(--radius-sm);background:var(--outage-tint);color:var(--outage);font-size:12px}

/* Public header and footer */
.sn-pubbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3);padding-bottom:var(--space-4);border-bottom:1px solid var(--border)}
.sn-pubbar__title{font:600 24px/32px var(--font-mono);letter-spacing:-.01em;margin:0}
.sn-pubfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-2);padding-top:var(--space-4);border-top:1px solid var(--border);font:400 12px/16px var(--font-mono);color:var(--fg-subtle)}
.sn-pubfoot a{color:var(--fg-muted)}

/* Page header */
.sn-back{display:inline-block;font:400 12px/16px var(--font-mono);color:var(--fg-muted);text-decoration:none;margin-bottom:var(--space-4)}
.sn-back:hover{color:var(--fg)}
.sn-pagehead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-3) var(--space-4);padding-bottom:var(--space-6);border-bottom:1px solid var(--border)}
.sn-pagehead h1{font:600 24px/32px var(--font-mono);letter-spacing:-.01em;margin:0;min-width:0}
.sn-pagehead__meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-3);margin-top:var(--space-2);font:400 12px/16px var(--font-mono);color:var(--fg-muted)}

/* Fields */
.sn-field{display:flex;flex-direction:column;gap:6px;max-width:var(--form-max)}
.sn-input,.sn-select,.sn-textarea{width:100%;font:400 14px/20px var(--font-mono);padding:7px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg);color:var(--fg)}
.sn-input::placeholder{color:var(--fg-subtle)}
.sn-input[aria-invalid="true"]{border-color:var(--outage)}
.sn-field__hint{font:400 13px/20px var(--font-sans);color:var(--fg-subtle)}
.sn-field__error{font:400 13px/20px var(--font-sans);color:var(--outage)}
.sn-option{display:inline-flex;align-items:center;gap:var(--space-2);color:var(--fg)}
.sn-switch{appearance:none;width:32px;height:18px;margin:0;border:1px solid var(--border-strong);border-radius:var(--radius-full);background:var(--bg);position:relative;cursor:pointer}
.sn-switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:var(--radius-full);background:var(--border-strong)}
.sn-switch:checked{background:var(--primary);border-color:var(--primary)}
.sn-switch:checked::after{left:16px;background:var(--on-primary)}

/* Search and bulk actions */
.sn-search{position:relative;display:flex;align-items:center;flex:1 1 280px;max-width:420px}
.sn-search .sn-input{padding-right:36px}
.sn-search .sn-kbd{position:absolute;right:8px}
.sn-bulk{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-3);padding:var(--space-2) var(--space-3);border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface-raised);box-shadow:var(--shadow-popover)}
.sn-bulk__count{margin-right:auto;color:var(--fg)}

/* Dialog */
.sn-scrim{display:grid;place-items:center;padding:var(--space-6);background:var(--scrim)}
.sn-dialog{width:100%;max-width:440px;padding:var(--space-6);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-raised);box-shadow:var(--shadow-popover)}
.sn-dialog h2{font:600 18px/28px var(--font-mono);margin:0 0 var(--space-2)}
.sn-dialog p{font:400 15px/24px var(--font-sans);color:var(--fg-muted);margin:0 0 var(--space-6)}
.sn-dialog__actions{display:flex;justify-content:flex-end;gap:var(--space-2)}

/* Callout */
.sn-callout{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3) var(--space-4);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);font:400 13px/20px var(--font-sans);color:var(--fg)}
.sn-callout .sn-mark{margin-top:5px}
.sn-callout b{font:600 13px/20px var(--font-mono)}
.sn-callout--degraded{background:var(--degraded-tint);border-color:var(--degraded-solid)}
.sn-callout--outage{background:var(--outage-tint);border-color:var(--outage-solid)}

/* Empty state */
.sn-empty{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2);padding:var(--space-8) var(--space-6);border:1px dashed var(--border-strong);border-radius:var(--radius-md)}
.sn-empty h3{font:600 14px/20px var(--font-mono);margin:0}
.sn-empty p{font:400 15px/24px var(--font-sans);color:var(--fg-muted);margin:0 0 var(--space-2);max-width:52ch}

/* Incidents */
.sn-incident{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-4) var(--space-6);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);color:inherit;text-decoration:none}
.sn-incident--outage{background:var(--outage-tint);border-color:var(--outage-solid)}
.sn-incident--degraded{background:var(--degraded-tint);border-color:var(--degraded-solid)}
.sn-incident__title{font:600 18px/28px var(--font-mono);margin:0}
.sn-incident__meta{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);font:400 12px/16px var(--font-mono);color:var(--fg-muted)}
.sn-incident__update{font:400 15px/24px var(--font-sans);margin:0;max-width:var(--prose-max)}
.sn-steps{display:flex;flex-wrap:wrap;gap:var(--space-1);list-style:none;margin:0;padding:0}
.sn-steps li{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font:400 12px/16px var(--font-mono);color:var(--fg-subtle)}
.sn-steps li::before{content:"";width:7px;height:7px;border:1.5px solid var(--unknown-solid)}
.sn-steps li[data-done]{color:var(--fg-muted)}
.sn-steps li[data-done]::before{background:var(--unknown-solid)}
.sn-steps li[aria-current="step"]{color:var(--on-primary);background:var(--primary);border-color:var(--primary)}
.sn-steps li[aria-current="step"]::before{background:var(--on-primary);border-color:var(--on-primary)}
.sn-timeline{list-style:none;margin:0;padding:0}
.sn-timeline li{display:grid;grid-template-columns:104px 1fr;gap:var(--space-4);padding:var(--space-3) 0;border-top:1px solid var(--border)}
.sn-timeline li:first-child{border-top:0}
.sn-timeline time{font:400 12px/24px var(--font-mono);color:var(--fg-subtle);font-variant-numeric:tabular-nums}
.sn-timeline p{font:400 15px/24px var(--font-sans);margin:0}
.sn-timeline__by{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:2px;font:400 12px/16px var(--font-mono);color:var(--fg-subtle)}
.sn-timeline li[data-kind="system"] p{font:400 14px/24px var(--font-mono);color:var(--fg-muted)}
.sn-vis{padding:1px 6px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font:400 11px/16px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--fg-muted)}
.sn-vis--published{border-color:var(--primary);color:var(--fg)}

/* Channel routing */
.sn-channel{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-3);padding:var(--space-3) 0;border-top:1px solid var(--border)}
.sn-channel__name{margin-right:auto;color:var(--fg)}
.sn-evts{display:inline-flex;gap:var(--space-1)}
.sn-evt{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:none;font:400 12px/16px var(--font-mono);color:var(--fg-subtle);cursor:pointer}
.sn-evt .sn-mark{opacity:.45}
.sn-evt[aria-pressed="true"]{color:var(--fg);background:var(--surface-raised)}
.sn-evt[aria-pressed="true"] .sn-mark{opacity:1}

/* Chart */
.sn-chart{width:100%;height:auto;display:block}
.sn-chart .grid{stroke:var(--border);stroke-width:1}
.sn-chart .line{fill:none;stroke:var(--fg-muted);stroke-width:1.5}
.sn-chart .area{fill:var(--overlay)}
.sn-chart .end{fill:var(--fg)}
.sn-chart .tick{font:400 11px var(--font-mono);fill:var(--fg-subtle)}
.sn-chart .evt-outage{fill:var(--outage-solid)}
.sn-chart .evt-degraded{fill:var(--degraded-solid)}

@media (max-width:560px){.sn-section__desc{margin-left:0;flex-basis:100%}.sn-timeline li{grid-template-columns:1fr;gap:0}.sn-banner__meta{margin-left:0;flex-basis:100%}}

/* Logo (inline, themed by tokens) */
.sn-logo{display:block;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.sn-logo .ink{stroke:var(--fg)}
.sn-logo .sig{stroke:var(--accent)}
.sn-logo .sig2{stroke:var(--accent);opacity:.55}
.sn-logo .dot{fill:var(--accent);stroke:none}
.sn-logo-option{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);flex:1 1 220px;min-width:0}
.sn-logo-option p{font:400 13px/20px var(--font-sans);color:var(--fg-muted);margin:0}

/* Prototype scaffolding: one centred column per page; a fake address bar on top shows the real route each screen maps to. */
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:400 14px/20px var(--font-mono)}
*{box-sizing:border-box}
.px-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface-raised);border-bottom:1px solid var(--border);font:400 12px/16px var(--font-mono)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface-raised)}
.px-url{flex:1 1 240px;min-width:0;padding:4px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--fg-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.px-url b{font-weight:400;color:var(--fg-subtle)}
.px-switch{display:inline-flex;gap:4px}
.px-switch a{padding:4px 12px;border-radius:var(--radius-sm);background:var(--bg);color:var(--fg-muted);text-decoration:none}
.px-switch a[aria-current="true"]{background:var(--primary);color:var(--on-primary)}
.px-page{display:flex;flex-direction:column;gap:var(--space-8);max-width:var(--page-max);margin:0 auto;padding-block:var(--space-6) var(--space-12);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.px-page>*{min-width:0}
.px-public{padding-block:var(--space-12)}
.px-page section{min-width:0}
.px-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3) var(--space-4)}
.px-h{margin:0 0 var(--space-3);color:var(--fg-subtle)}
.px-emptyline{margin:var(--space-3) 0 0;font:400 13px/20px var(--font-sans);color:var(--fg-subtle)}
.px-secbody{padding-top:var(--space-3)}
.px-show{margin-top:var(--space-3)}
.px-inline{display:inline-flex;margin-left:6px;vertical-align:middle}
.px-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-8)}
.px-two--form{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
.px-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4);align-items:start}
.px-code{font:400 13px/20px var(--font-mono);min-height:280px;resize:vertical}
.px-narrow{max-width:var(--form-max);width:100%}
.px-route{margin-bottom:var(--space-6)}
.px-composer{margin-top:var(--space-4)}
.px-click{cursor:pointer}
.px-list{max-width:var(--form-max)}
.px-rowcard{padding:var(--space-4);gap:var(--space-3)}
.px-metric{font:600 36px/40px var(--font-mono);letter-spacing:-.02em}
.px-metric small{display:block;font:400 12px/16px var(--font-mono);letter-spacing:0;color:var(--fg-subtle)}
.px-login{display:flex;flex-direction:column;gap:var(--space-8);width:100%;max-width:360px;margin:12vh auto 0}
.px-bulkwrap{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10}
.px-scrim{position:fixed;inset:0;z-index:40}
.px-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;max-width:min(520px,calc(100% - 32px));padding:10px 16px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface-raised);box-shadow:var(--shadow-popover);font:400 13px/20px var(--font-sans);color:var(--fg)}
code{font:400 13px/20px var(--font-mono)}
:where(a){color:inherit}
@media (max-width:760px){.px-two,.px-two--form,.px-grid3{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.sn-btn,.sn-tag,.sn-card,.sn-chip,.sn-seg button{transition:background-color .15s,border-color .15s,color .15s}}

 <div class="px-two"><section><h2 class="sn-section__title px-h">Updates</h2>${timeline(i,true)}</section><section><h2 class="sn-section__title px-h">Report</h2>${i.report==='published'?report(i,'Public'):'<p class="px-emptyline">A report will be published here after the incident is resolved.</p>'}</section></div>`+pubFoot()}

const DIALOGS={publish:['Publish this incident?','The status page will show a banner with the title, state, start time, affected checks and the notes marked “Show on status page”. Internal notes stay private.','Publish incident',0],report:['Publish this report?','The public version of the summary, impact, root cause and follow-ups will appear on the incident’s public page. The internal version stays private.','Publish report',0],delete:['Delete this test?','Its run history and uptime figures are deleted with it. Incidents it was part of are kept.','Delete test',1],bulkdelete:['Delete the selected tests?','Their run history and uptime figures are deleted with them. This cannot be undone.','Delete tests',1],delchannel:['Delete this channel?','Tags and tests routed to it stop sending alerts there.','Delete channel',1],delsecret:['Delete this secret?','Tests that read it will fail on their next run.','Delete secret',1]};
function dialog(){if(!S.dialog)return '';const d=DIALOGS[S.dialog];return `<div class="sn-scrim px-scrim"><div class="sn-dialog" role="alertdialog" aria-labelledby="dt"><h2 id="dt">${d[0]}</h2><p>${d[1]}</p><div class="sn-dialog__actions"><button class="sn-btn sn-btn--ghost" data-act="cancel">Cancel</button><button class="sn-btn ${d[3]?'sn-btn--danger':'sn-btn--primary'}" data-act="confirm">${d[2]}</button></div></div></div>`}
const PAGES={status:pageStatus,check:pageCheck,pubincident:pagePubIncident,admin:pageAdmin,tests:pageTests,test:pageTest,edit:pageEdit,incidents:pageIncidents,incident:pageIncident,notifications:pageNotifications,secrets:pageSecrets,tokens:pageTokens};
function render(){let r=route();if(!PAGES[r.page])r={page:'status',arg:''};if(!isPublic(r.page)&&r.page!=='admin'&&!S.signedIn){r={page:'admin',arg:''}}if(r.page==='admin'&&S.signedIn){r={page:'tests',arg:''}}
 const a=document.activeElement,fid=a&&a.id,pos=a&&a.selectionStart;
 document.getElementById('app').innerHTML=chrome(r)+`<main class="px-page sn ${isPublic(r.page)?'px-public':''}">${PAGES[r.page](r.arg)}</main>${dialog()}${S.toast?`<div class="px-toast" role="status">${esc(S.toast)}</div>`:''}`;
 if(fid){const el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}}
let toastT;function toast(m){S.toast=m;clearTimeout(toastT);toastT=setTimeout(()=>{S.toast='';render()},3200)}
const curInc=()=>INC[route().arg]||INC.radar;
function act(a,v,el,ev){switch(a){
 case 'period':S.period=v;break;case 'view':S.view=v;break;case 'tz':S.tz=v;break;case 'ver':S.ver=v;break;
 case 'theme':S.theme=v;if(v==='System')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v.toLowerCase());break;
 case 'tag':S.tag=v||null;break;case 'tagnav':S.tag=v;location.hash='#tests';break;case 'ptag':S.ptag=v||null;break;case 'clearq':S.q='';S.tag=null;break;
 case 'toggle':S.open[v]=!S.open[v];break;case 'jump':S.open[v]=true;render();{const e=document.getElementById(v);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}return;
 case 'sel':S.sel.has(v)?S.sel.delete(v):S.sel.add(v);break;
 case 'bulk':if(v==='pause'||v==='resume'){T.forEach(t=>{if(S.sel.has(t.id)){if(v==='pause'){t.state='paused';t.since=''}else if(t.state==='paused'){t.state='operational'}}});toast(`${S.sel.size} test${S.sel.size>1?'s':''} ${v==='pause'?'paused':'resumed'}.`);S.sel.clear()}else if(v==='run'){toast(`Queued ${S.sel.size} run${S.sel.size>1?'s':''}.`)}else S.sel.clear();break;
 case 'ask':S.dialog=v;break;case 'cancel':S.dialog=null;break;
 case 'confirm':{const d=S.dialog;S.dialog=null;const i=curInc();if(d==='publish'){i.published=true;i.notes.push({t:'21:12 UTC',sys:1,text:'Incident published to the status page'});toast('Published. The status page now shows this incident.')}else if(d==='report'){i.report='published';i.published=true;toast('Report published.')}else if(d==='bulkdelete'){for(const id of S.sel){const n=T.findIndex(t=>t.id===id);if(n>=0)T.splice(n,1)}S.sel.clear();toast('Tests deleted.')}else if(d==='delete'){const n=T.findIndex(t=>t.id===route().arg);if(n>=0)T.splice(n,1);location.hash='#tests';toast('Test deleted.')}else toast('Deleted.');break}
 case 'unpublish':INC[v].published=false;toast('Unpublished. The status page no longer shows this incident.');break;
 case 'istate':{const i=curInc();if(i.state!==v){i.state=v;i.notes.push({t:'21:12 UTC',sys:1,text:'State changed to '+v});if(v==='Resolved')i.tests.forEach(id=>{const t=T.find(x=>x.id===id);if(t){t.state='recovered';t.since='recovered just now';t.sub='was in '+(t.id==='radar-fresh'?'Outage for 2 h 27 min':'Degraded for 46 min')}})}break}
 case 'addnote':{const txt=document.getElementById('note').value.trim();if(!txt){toast('Write the note first.');break}INC[v].notes.push({t:'21:12 UTC',by:'victor',pub:document.getElementById('notepub').checked,text:txt});S.draft='';S.draftPub=false;break}
 case 'evt':{const [n,e]=v.split('|');CH[n].ev[e]=CH[n].ev[e]?0:1;break}case 'chon':CH[v].on=!CH[v].on;break;
 case 'gentoken':S.token='snt_'+Math.random().toString(36).slice(2,12)+Math.random().toString(36).slice(2,12);break;
 case 'signout':S.signedIn=false;location.hash='#status';break;
 case 'save':toast('Saved. Code compiled without errors.');location.hash=v?'#test-'+v:'#tests';break;
 case 'toast':toast(v);break;case 'noop':break;default:return}render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='FORM'||el.matches('input[type=checkbox]'))return;if(el.tagName==='A'||el.tagName==='BUTTON'||el.tagName==='LI')e.preventDefault();act(el.dataset.act,el.dataset.v,el,e)});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('input[type=checkbox][data-act]'))act(el.dataset.act,el.dataset.v,el,e);if(el.id==='notepub')S.draftPub=el.checked});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;render()}if(e.target.id==='note')S.draft=e.target.value});
document.addEventListener('submit',e=>{e.preventDefault();S.signedIn=true;location.hash='#tests';render()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){const q=document.getElementById('q');if(q){e.preventDefault();q.focus()}}if(e.key==='Escape'){if(S.dialog){S.dialog=null;render()}else if(document.activeElement.id==='q'){S.q='';render()}}});
window.addEventListener('hashchange',()=>{S.sel.clear();render();window.scrollTo(0,0)});
render();
</script>
